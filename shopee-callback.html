<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Shopee Authorization · Sleep Expert</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#1b1c4c;color:#fff;font:15px/1.6 system-ui,sans-serif}
    main{width:min(520px,calc(100% - 40px));text-align:center}.spin{width:34px;height:34px;margin:18px auto;border:3px solid #ffffff45;border-top-color:#fff;border-radius:50%;animation:r .8s linear infinite}
    @keyframes r{to{transform:rotate(360deg)}}.err{color:#ffd2cf}
  </style>
</head>
<body>
<main>
  <h1>Sleep Expert</h1>
  <div class="spin"></div>
  <p id="msg">Đang hoàn tất uỷ quyền Shopee…</p>
</main>
<script>
  (function(){
    var q=new URLSearchParams(location.search);
    var app=q.get('app'),code=q.get('code'),shop=q.get('shop_id');
    if(!app||!code||!shop){
      document.querySelector('.spin').style.display='none';
      var m=document.getElementById('msg');m.className='err';m.textContent='Thiếu mã uỷ quyền Shopee. Vui lòng mở lại liên kết Authorize.';
      return;
    }
    var target='https://jkrczsrhonmqxwzzdgen.supabase.co/functions/v1/shopee-app-auth?app='+
      encodeURIComponent(app)+'&code='+encodeURIComponent(code)+'&shop_id='+encodeURIComponent(shop);
    location.replace(target);
  })();
</script>
</body>
</html>
