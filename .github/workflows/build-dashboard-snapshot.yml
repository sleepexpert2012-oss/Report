name: Build dashboard snapshot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "scripts/build_snapshot.py"
      - "scripts/revenue_rules.py"
      - "scripts/requirements.txt"
      - ".github/workflows/build-dashboard-snapshot.yml"
  schedule:
    # Mỗi giờ: workflow tự kéo tồn kho trước rồi mới build snapshot, tránh hai
    # scheduler độc lập chạy lệch nhau. GitHub có thể bắt đầu trễ vài phút nhưng
    # thứ tự inventory -> snapshot trong cùng một job luôn được đảm bảo.
    - cron: "15 * * * *"

concurrency:
  group: dashboard-snapshot
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Sync latest Shopee inventory
        if: github.event_name != 'push'
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error --max-time 180 \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{}' \
            'https://jkrczsrhonmqxwzzdgen.supabase.co/functions/v1/inventory-responder')"
          INVENTORY_RESPONSE="$response" python - <<'PY'
          import json
          import os

          payload = json.loads(os.environ["INVENTORY_RESPONSE"])
          if not payload.get("ok"):
              raise SystemExit(f"Shopee inventory sync failed: {payload.get('error', payload)}")
          print(
              "Inventory synced:",
              payload.get("synced_at"),
              "| stock:", payload.get("total_seller_stock"),
              "| rows:", payload.get("sku_warehouse_rows"),
          )
          PY
      - run: pip install -r scripts/requirements.txt
      - name: Build and publish current snapshot
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/build_snapshot.py
