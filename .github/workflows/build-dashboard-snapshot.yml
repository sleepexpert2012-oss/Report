name: Build dashboard snapshot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "scripts/build_snapshot.py"
      - "scripts/sync_shopee_pipeline.py"
      - "scripts/revenue_rules.py"
      - "scripts/requirements.txt"
      - ".github/workflows/build-dashboard-snapshot.yml"
  schedule:
    # Một pipeline duy nhất mỗi giờ: Sales -> Ads -> Inventory -> Ops ->
    # Affiliate/Video -> freshness gate -> snapshot. Không publish dữ liệu nửa cũ.
    - cron: "35 * * * *"

concurrency:
  group: dashboard-snapshot
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Sync and verify every authorized Shopee API source
        run: python scripts/sync_shopee_pipeline.py --output sync-report.json
      - name: Build and publish current snapshot
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SYNC_REPORT_PATH: sync-report.json
        run: python scripts/build_snapshot.py
